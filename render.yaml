services:
  - type: web
    name: brothers-sports-api
    runtime: node
    plan: free
    # Same region as the Neon database.
    region: singapore
    rootDir: backend
    # NODE_ENV=production makes npm skip devDependencies, and tsc lives there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRE_IN
        value: 7d
      # Render adds 3 proxies and the Vercel rewrite adds 1.
      - key: TRUST_PROXY_HOPS
        value: "4"
      - key: DB_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      # Checkout shows placeholder account numbers when these are missing.
      - key: ESEWA_ENABLED
        sync: false
      - key: ESEWA_ACCOUNT_NAME
        sync: false
      - key: ESEWA_ACCOUNT_NUMBER
        sync: false
      - key: KHALTI_ENABLED
        sync: false
      - key: KHALTI_ACCOUNT_NAME
        sync: false
      - key: KHALTI_ACCOUNT_NUMBER
        sync: false
      - key: BANK_ENABLED
        sync: false
      - key: COD_ENABLED
        sync: false

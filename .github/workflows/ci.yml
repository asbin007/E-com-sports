name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Dev and tests run through tsx, so only this catches crashes in the
      # compiled output that production runs.
      - run: npm run build
      - name: Load the compiled app
        run: node -e "import('./dist/src/app.js').then(() => process.exit(0))"
        env:
          DB_URL: postgres://ci:ci@127.0.0.1:1/ci
          JWT_SECRET_KEY: ci
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          RESEND_API: ci
          CLOUDINARY_CLOUD_NAME: ci
          CLOUDINARY_API_KEY: ci
          CLOUDINARY_API_SECRET: ci

  web:
    name: ${{ matrix.app }} (typecheck + lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

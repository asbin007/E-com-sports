# Keeps the free Render instance awake during Nepali shopping hours.
#
# Render spins a free instance down after ~15 minutes idle, and the next
# visitor then waits ~50s for it to boot — which reads as a broken shop. This
# pings it often enough that it never goes down while customers are awake.
#
# It exists because the previous pinger (cron-job.org) disabled itself after 26
# consecutive failures: once the instance was asleep, Render answered with its
# own large "waking up" page, the pinger rejected it as "Response data too
# big", and nothing was left to wake the service. This job tolerates that — it
# waits up to two minutes and retries, because a slow answer from a cold
# instance is the normal case, not a failure.
#
# Deliberately NOT 24/7. The Render account shares 750 free instance-hours a
# month across four services; a round-the-clock ping would eat almost all of
# them. 01:15–17:15 UTC is 07:00–23:00 in Kathmandu (UTC+5:45).
name: Keep the API awake

on:
  schedule:
    # GitHub cron is UTC and best-effort — it can run late under load, so the
    # interval sits well inside Render's ~15 minute idle window.
    - cron: "*/10 1-17 * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          set -u
          URL="https://brothers-sports-api.onrender.com/api/ping"
          # --max-time 120: a cold instance legitimately takes ~50s.
          # --retry with --retry-all-errors: one refused connection during a
          # restart should not count as the service being down.
          code=$(curl --silent --show-error --location \
                      --max-time 120 \
                      --retry 3 --retry-delay 10 --retry-all-errors \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      "$URL") || true

          echo "HTTP $code from $URL"

          # 204 is what the route returns; accept any 2xx so a later change to
          # the route does not silently turn this into a red cross every run.
          case "$code" in
            2??) echo "API is awake." ;;
            *)   echo "::warning::API did not answer cleanly (HTTP $code). It may still be waking."
                 exit 0 ;;
          esac

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Football boots, club jerseys, team kits, Kelme footballs, trophies and medals from Brothers Sports House, Chaudhary Market, Bardibas. Delivered all over Nepal, cash on delivery."
    />
    <meta name="theme-color" content="#EEEFEA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11130E" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brothers Sports House" />
    <meta property="og:title" content="Brothers Sports House — Football boots, kits and trophies" />
    <meta
      property="og:description"
      content="Boots, club jerseys, team kits, footballs and trophies from Chaudhary Market, Bardibas. Cash on delivery, all over Nepal."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the persisted theme before first paint. Must stay in sync with
         src/context/ThemeContext.tsx (localStorage key "bsh-theme", classes "light"/"dark"). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bsh-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to CSS defaults */
        }
      })();
    </script>
    <title>Brothers Sports House | Football Boots, Kits &amp; Trophies in Nepal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Kit Room type pair (frontend/MASTER.md): Teko for display and numerals,
         Mukta for body. Both carry Devanagari as well as Latin. -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
